<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DevLens Focus Mode</title>
  </head>
  <body>
    <main class="blocked-shell">
      <section class="blocked-card">
        <div class="lens-mark" aria-hidden="true">&lt;◉/&gt;</div>
        <p class="eyebrow">DEVLENS FOCUS MODE</p>
        <h1>Return to research.</h1>
        <p id="message">This site is paused while your focus session is active.</p>
        <div class="target" id="target"></div>
        <div class="actions">
          <button id="allow" type="button">Temporarily allow</button>
          <button id="end" class="secondary" type="button">End focus session</button>
        </div>
        <a href="https://developer.mozilla.org/">Return to research</a>
      </section>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
